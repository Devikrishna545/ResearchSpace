[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for a local-first multi-agent research assistant"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20", "alembic>=1.14", "httpx>=0.27", "jinja2>=3.1", "python-dotenv>=1.0", "pypdf>=5.0", "argon2-cffi>=23.1", "email-validator>=2.0", "cryptography>=42", "python-multipart>=0.0.9", "pdfplumber>=0.11", "pypdfium2>=4.30", "numpy>=2.1", "scipy>=1.14", "pandas>=2.2"]
[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23"]
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.setuptools.package-data]
app = ["platform/llm/prompts/templates/**/*.jinja", "platform/llm/prompts/*.yaml"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
