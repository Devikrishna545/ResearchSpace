services:
  api:
    build: ./backend
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./data:/app/data"]
    depends_on: [postgres, qdrant, redis, ollama]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: research, POSTGRES_PASSWORD: research, POSTGRES_DB: research}
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["./data/qdrant:/qdrant/storage"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["./data/ollama:/root/.ollama"]
  grobid:
    image: lfoppiano/grobid:0.8.0
    ports: ["8070:8070"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./data/minio:/data"]
